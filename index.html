<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엑셀 PDF 항목 비교 도구</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #1f2937;
    }

    .description {
      color: #555;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .upload-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    .upload-box {
      border: 2px dashed #cbd5e1;
      padding: 20px;
      border-radius: 12px;
      background: #f8fafc;
    }

    .upload-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input[type="file"] {
      width: 100%;
    }

    .option-section {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .option-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .option-row label {
      font-weight: bold;
    }

    input[type="text"],
    input[type="number"] {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .result {
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f1f5f9;
    }

    .match {
      color: #15803d;
      font-weight: bold;
    }

    .mismatch {
      color: #dc2626;
      font-weight: bold;
    }

    .missing {
      color: #d97706;
      font-weight: bold;
    }

    .summary {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .summary-card {
      flex: 1;
      min-width: 180px;
      padding: 16px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .summary-card strong {
      display: block;
      font-size: 24px;
      margin-top: 8px;
    }

    pre {
      background: #111827;
      color: #e5e7eb;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    @media (max-width: 768px) {
      .upload-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>엑셀 PDF 항목 비교 도구</h1>

    <p class="description">
      엑셀 파일과 PDF 파일을 업로드하면 엑셀에 있는 항목이 PDF 문서에도 동일하게 기재되어 있는지 비교합니다.
      <br />
      기본 방식은 엑셀의 각 행을 기준으로 PDF 텍스트 내 포함 여부를 검사합니다.
    </p>

    <div class="upload-section">
      <div class="upload-box">
        <label for="excelFile">엑셀 파일 업로드</label>
        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" />
      </div>

      <div class="upload-box">
        <label for="pdfFile">PDF 파일 업로드</label>
        <input type="file" id="pdfFile" accept=".pdf" />
      </div>
    </div>

    <div class="option-section">
      <h3>비교 옵션</h3>

      <div class="option-row">
        <label>
          엑셀 헤더 행 번호:
          <input type="number" id="headerRow" value="1" min="1" />
        </label>

        <label>
          비교할 컬럼명:
          <input type="text" id="compareColumns" placeholder="예: 품명,규격,수량" />
        </label>
      </div>

      <p style="color:#666; font-size:14px;">
        비교할 컬럼명을 비워두면 엑셀의 모든 컬럼 값을 합쳐서 PDF 내용과 비교합니다.
        여러 컬럼은 쉼표로 구분하세요.
      </p>
    </div>

    <button id="compareBtn" onclick="compareFiles()">비교하기</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let excelRows = [];
    let pdfText = "";

    async function readExcel(file, headerRowNumber) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = function (e) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            const jsonRows = XLSX.utils.sheet_to_json(worksheet, {
              header: 1,
              defval: ""
            });

            const headerIndex = headerRowNumber - 1;
            const headers = jsonRows[headerIndex].map(h => String(h).trim());

            const rows = jsonRows.slice(headerIndex + 1).map((row, index) => {
              const obj = { __rowNumber: index + headerRowNumber + 1 };

              headers.forEach((header, i) => {
                if (header) {
                  obj[header] = row[i] !== undefined ? String(row[i]).trim() : "";
                }
              });

              return obj;
            }).filter(row => {
              return Object.keys(row)
                .filter(key => key !== "__rowNumber")
                .some(key => row[key] !== "");
            });

            resolve(rows);
          } catch (error) {
            reject(error);
          }
        };

        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    async function readPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

      let fullText = "";

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();

        const pageText = content.items
          .map(item => item.str)
          .join(" ");

        fullText += pageText + "\n";
      }

      return normalizeText(fullText);
    }

    function normalizeText(text) {
      return String(text)
        .replace(/\s+/g, " ")
        .replace(/[　]/g, " ")
        .trim()
        .toLowerCase();
    }

    function buildCompareText(row, selectedColumns) {
      let values = [];

      if (selectedColumns.length > 0) {
        selectedColumns.forEach(col => {
          if (row[col] !== undefined && row[col] !== "") {
            values.push(row[col]);
          }
        });
      } else {
        Object.keys(row).forEach(key => {
          if (key !== "__rowNumber" && row[key] !== "") {
            values.push(row[key]);
          }
        });
      }

      return values.join(" ");
    }

    function compareExcelWithPdf(rows, pdfText, selectedColumns) {
      return rows.map(row => {
        const originalText = buildCompareText(row, selectedColumns);
        const normalizedCompareText = normalizeText(originalText);

        let status = "누락";
        let detail = "PDF에서 해당 항목을 찾지 못했습니다.";

        if (!normalizedCompareText) {
          status = "비교불가";
          detail = "비교할 값이 없습니다.";
        } else if (pdfText.includes(normalizedCompareText)) {
          status = "일치";
          detail = "엑셀 항목이 PDF에 동일하게 존재합니다.";
        } else {
          const partialMatches = [];

          Object.keys(row).forEach(key => {
            if (key !== "__rowNumber" && row[key]) {
              const value = normalizeText(row[key]);
              if (value && pdfText.includes(value)) {
                partialMatches.push(`${key}: ${row[key]}`);
              }
            }
          });

          if (partialMatches.length > 0) {
            status = "부분일치";
            detail = "일부 값만 PDF에서 확인됨: " + partialMatches.join(", ");
          }
        }

        return {
          rowNumber: row.__rowNumber,
          excelData: row,
          compareText: originalText,
          status,
          detail
        };
      });
    }

    function renderResult(results) {
      const total = results.length;
      const matched = results.filter(r => r.status === "일치").length;
      const partial = results.filter(r => r.status === "부분일치").length;
      const missing = results.filter(r => r.status === "누락").length;
      const unable = results.filter(r => r.status === "비교불가").length;

      let html = `
        <h2>비교 결과</h2>

        <div class="summary">
          <div class="summary-card">
            전체 항목
            <strong>${total}</strong>
          </div>
          <div class="summary-card">
            일치
            <strong style="color:#15803d;">${matched}</strong>
          </div>
          <div class="summary-card">
            부분일치
            <strong style="color:#d97706;">${partial}</strong>
          </div>
          <div class="summary-card">
            누락
            <strong style="color:#dc2626;">${missing}</strong>
          </div>
          <div class="summary-card">
            비교불가
            <strong>${unable}</strong>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>엑셀 행</th>
              <th>비교 항목</th>
              <th>상태</th>
              <th>상세 내용</th>
              <th>엑셀 원본 데이터</th>
            </tr>
          </thead>
          <tbody>
      `;

      results.forEach(result => {
        let statusClass = "";

        if (result.status === "일치") statusClass = "match";
        else if (result.status === "누락") statusClass = "mismatch";
        else if (result.status === "부분일치") statusClass = "missing";

        html += `
          <tr>
            <td>${escapeHtml(result.rowNumber)}</td>
            <td>${escapeHtml(result.compareText)}</td>
            <td class="${statusClass}">${escapeHtml(result.status)}</td>
            <td>${escapeHtml(result.detail)}</td>
            <td><pre>${escapeHtml(JSON.stringify(result.excelData, null, 2))}</pre></td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
      `;

      document.getElementById("result").innerHTML = html;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function compareFiles() {
      const excelFile = document.getElementById("excelFile").files[0];
      const pdfFile = document.getElementById("pdfFile").files[0];
      const headerRow = Number(document.getElementById("headerRow").value || 1);
      const compareColumnsInput = document.getElementById("compareColumns").value.trim();

      const selectedColumns = compareColumnsInput
        ? compareColumnsInput.split(",").map(col => col.trim()).filter(Boolean)
        : [];

      if (!excelFile) {
        alert("엑셀 파일을 업로드해 주세요.");
        return;
      }

      if (!pdfFile) {
        alert("PDF 파일을 업로드해 주세요.");
        return;
      }

      const button = document.getElementById("compareBtn");
      button.disabled = true;
      button.textContent = "비교 중...";

      document.getElementById("result").innerHTML = "<p>파일을 분석하고 있습니다...</p>";

      try {
        excelRows = await readExcel(excelFile, headerRow);
        pdfText = await readPdf(pdfFile);

        const results = compareExcelWithPdf(excelRows, pdfText, selectedColumns);

        renderResult(results);
      } catch (error) {
        console.error(error);
        document.getElementById("result").innerHTML = `
          <p style="color:#dc2626; font-weight:bold;">
            오류가 발생했습니다: ${escapeHtml(error.message)}
          </p>
        `;
      } finally {
        button.disabled = false;
        button.textContent = "비교하기";
      }
    }
  </script>
</body>
</html>
