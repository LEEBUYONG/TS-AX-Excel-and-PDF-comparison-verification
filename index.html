<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엑셀 vs 통합 PDF 비교기 (수정완성본)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fb; color: #1f2937; }
    header { background: #0b5cab; color: #fff; padding: 14px 18px; }
    header h1 { margin: 0; font-size: 18px; }
    .wrap { max-width: 1280px; margin: 16px auto; padding: 0 12px; }
    .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media(max-width:900px){ .grid{ grid-template-columns:1fr; } }

    label { display: block; font-size: 13px; font-weight: 700; color: #4b5563; margin-bottom: 6px; }
    input[type=file], select {
      width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff;
    }
    button {
      border: none; background: #0b5cab; color: #fff; padding: 10px 14px; border-radius: 8px;
      font-weight: 700; cursor: pointer;
    }
    button:disabled { background: #9ca3af; cursor: not-allowed; }

    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .muted { color: #6b7280; font-size: 12px; }
    .ok { color: #166534; }
    .warn { color: #92400e; }
    .err { color: #991b1b; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .chip { padding: 6px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .match { background: #dcfce7; color: #166534; }
    .similar { background: #fef9c3; color: #854d0e; }
    .mismatch { background: #fee2e2; color: #991b1b; }
    .missing { background: #e5e7eb; color: #374151; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 9px; vertical-align: top; }
    th { background: #f9fafb; text-align: left; }
    .txt {
      max-height: 120px; overflow: auto; white-space: pre-wrap;
      background: #f8fafc; border: 1px solid #e2e8f0; padding: 7px; border-radius: 6px;
    }
    .badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: 700; display: inline-block; }
    .pbar { height: 6px; background: #e5e7eb; border-radius: 8px; margin-top: 4px; }
    .pfill { height: 6px; background: #0b5cab; border-radius: 8px; }
    .small { font-size: 11px; color: #6b7280; }
    .warnbox{
      margin-top:8px; padding:8px 10px; border-radius:8px;
      background:#fffbeb; border:1px solid #fde68a; color:#92400e; font-size:12px;
    }
  </style>
</head>
<body>
  <header><h1>📊 엑셀 vs 통합 PDF 비교기 (수정완성본)</h1></header>

  <div class="wrap">
    <div class="card grid">
      <div>
        <label>엑셀 파일 (.xlsx/.xls)</label>
        <input id="excelFile" type="file" accept=".xlsx,.xls"/>
        <div class="muted" id="excelMsg">엑셀을 선택하세요</div>
      </div>
      <div>
        <label>통합 PDF 파일 (전체 수강생 포함)</label>
        <input id="pdfFile" type="file" accept=".pdf"/>
        <div class="muted" id="pdfMsg">PDF를 선택하세요</div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div style="min-width:340px;flex:1">
          <label>수강생 선택</label>
          <select id="studentSelect"><option value="">-- 엑셀 업로드 후 선택 --</option></select>
        </div>
        <div style="padding-top:18px"><button id="btnLoadPdf" disabled>PDF 텍스트 추출</button></div>
        <div style="padding-top:18px"><button id="btnCompare" disabled>선택 수강생 비교</button></div>
        <div style="padding-top:18px"><button id="btnCompareAll" disabled>전체 수강생 일괄 비교</button></div>
      </div>
      <div id="status" class="muted" style="margin-top:8px">대기 중</div>
      <div class="warnbox">
        ⚠️ 이 버전은 <b>PDF 텍스트 레이어</b> 기반입니다. 스캔 이미지 PDF면 인식이 약할 수 있습니다(OCR 백엔드 필요).
      </div>
    </div>

    <div class="card" id="result">
      <div class="muted">결과가 여기에 표시됩니다.</div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    let excelRows = [];
    let headers = [];
    let pdfPages = [];      // [{page, text}]
    let pdfAllText = "";
    let headerRowIdx = 0;

    const fields = [
      "과제명",
      "문제 인식 및 정의",
      "솔루션 설계",
      "LLM 활용 구현",
      "검증 및 개선",
      "비전(Computer Vision) 프로젝트",
      "머신러닝(표준 ML) 프로젝트",
      "딥러닝(고급 DL) 프로젝트",
      "과제 상세",
      "종합 제언",
      "단기 적용 계획",
      "중장기 적용 계획",
      "진행률",
    ];
    const levels = ["보통","우수","탁월","초급","중급","고급","전문가"];

    const excelFile = document.getElementById("excelFile");
    const pdfFile = document.getElementById("pdfFile");
    const studentSelect = document.getElementById("studentSelect");
    const btnLoadPdf = document.getElementById("btnLoadPdf");
    const btnCompare = document.getElementById("btnCompare");
    const btnCompareAll = document.getElementById("btnCompareAll");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    // ---------------- 유틸 ----------------
    function cleanKey(s){
      return String(s || "")
        .replace(/\s+/g, "")
        .replace(/[()\[\]\/:_\-]/g, "")
        .toLowerCase();
    }
    function normalize(s){
      return String(s || "").toLowerCase().replace(/\s+|[.,·•\-]/g, "");
    }
    function findLevel(s){
      s = String(s || "");
      return levels.find(x => s.includes(x)) || null;
    }
    function tokenRatio(a,b){
      const stop = new Set(["및","을","를","이","가","은","는","의","에","로","으로","하고","하여","수","것","등","또한","통해","대한","위한","본","에서","으로서","합니다","있습니다"]);
      const tok = t => String(t||"")
        .replace(/[^가-힣a-zA-Z0-9\s]/g," ")
        .split(/\s+/)
        .filter(x => x.length > 1 && !stop.has(x));
      const A = new Set(tok(a)), B = new Set(tok(b));
      if(!A.size || !B.size) return 0;
      let inter = 0; A.forEach(x => { if(B.has(x)) inter++; });
      return inter / Math.min(A.size, B.size);
    }

    function isEmptyRow(obj){
      return Object.values(obj).every(v => String(v ?? "").trim() === "");
    }

    function pickNameColumn(){
      const candidates = headers.filter(h => /성함|이름|수강생|수료생|성명/i.test(h));
      if(candidates.length) return candidates[0];

      // fallback: 첫 컬럼
      return headers[0] || null;
    }

    function pickTaskColumn(){
      const c = headers.find(h => /과제명/i.test(h));
      return c || null;
    }

    function pickName(row){
      const nk = pickNameColumn();
      if(!nk) return "";
      return String(row[nk] ?? "").trim();
    }

    function findCol(target){
      const t = cleanKey(target);

      // 1) 정확
      let hit = headers.find(h => cleanKey(h) === t);
      if(hit) return hit;

      // 2) 포함
      hit = headers.find(h => cleanKey(h).includes(t) || t.includes(cleanKey(h)));
      if(hit) return hit;

      // 3) 별칭
      const alias = {
        "문제인식및정의":["문제정의","문제인식","문제인식정의"],
        "솔루션설계":["해결방안설계","해결설계","설계"],
        "llm활용구현":["llm구현","활용구현","llm활용"],
        "검증및개선":["검증개선","검증","개선"],
        "비전computervision프로젝트":["비전프로젝트","cv프로젝트","computervision프로젝트"],
        "머신러닝표준ml프로젝트":["머신러닝프로젝트","ml프로젝트","표준ml프로젝트"],
        "딥러닝고급dl프로젝트":["딥러닝프로젝트","dl프로젝트","고급dl프로젝트"],
        "과제상세":["상세","과제내용"],
        "종합제언":["제언","종합의견"],
        "단기적용계획":["단기계획"],
        "중장기적용계획":["중장기계획"],
        "진행률":["완료율","진행상황"]
      };
      const al = alias[t] || [];
      for(const a of al){
        const h = headers.find(x => cleanKey(x).includes(cleanKey(a)));
        if(h) return h;
      }

      return null;
    }

    function fieldKeywords(field){
      const m = {
        "과제명": ["과제명"],
        "문제 인식 및 정의": ["문제 인식", "문제 인식 및 정의"],
        "솔루션 설계": ["솔루션 설계"],
        "LLM 활용 구현": ["LLM 활용 구현", "LLM 활용"],
        "검증 및 개선": ["검증 및 개선"],
        "비전(Computer Vision) 프로젝트": ["비전", "Computer Vision"],
        "머신러닝(표준 ML) 프로젝트": ["머신러닝", "표준 ML"],
        "딥러닝(고급 DL) 프로젝트": ["딥러닝", "고급 DL"],
        "과제 상세": ["과제 상세", "과제상세"],
        "종합 제언": ["종합 제언", "종합제언"],
        "단기 적용 계획": ["단기 적용 계획", "단기적용"],
        "중장기 적용 계획": ["중장기 적용 계획", "중장기적용"],
        "진행률": ["진행률", "완료", "% 완료"]
      };
      return m[field] || [field];
    }

    function extractNear(text, keywords, window=800){
      if(typeof keywords === "string") keywords = [keywords];
      for(const kw of keywords){
        const i = text.indexOf(kw);
        if(i !== -1){
          return text.substring(Math.max(0, i-120), i+window).replace(/\s+/g," ").trim();
        }
      }
      return "";
    }

    // ---------------- 엑셀 헤더 자동탐지 ----------------
    async function loadExcelSmart(file){
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      const ws = wb.Sheets[wb.SheetNames[0]];

      const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });

      let hdr = -1;
      for(let i=0; i<Math.min(aoa.length, 40); i++){
        const row = (aoa[i] || []).map(v => String(v).trim());
        const joined = row.join(" | ");
        if(
          /성함|이름|수강생|수료생|성명/.test(joined) ||
          /과제명/.test(joined) ||
          /입과 평가|수료 평가/.test(joined)
        ){
          hdr = i; break;
        }
      }
      if(hdr === -1) hdr = 0;

      const rawHeaders = (aoa[hdr] || []).map(h => String(h).trim());
      const headersLocal = rawHeaders.map((h, idx) => h || `__COL_${idx}`);

      const rows = [];
      for(let r=hdr+1; r<aoa.length; r++){
        const arr = aoa[r] || [];
        const obj = {};
        headersLocal.forEach((h,c) => obj[h] = arr[c] ?? "");
        if(!isEmptyRow(obj)) rows.push(obj);
      }

      // __COL_x 빈 헤더 제거
      const cleanedRows = rows.map(row => {
        const obj = {};
        for(const [k,v] of Object.entries(row)){
          if(!k.startsWith("__COL_")) obj[k] = v;
        }
        return obj;
      });

      const cleanedHeaders = headersLocal.filter(h => !h.startsWith("__COL_"));

      return { rows: cleanedRows, headers: cleanedHeaders, headerRowIdx: hdr };
    }

    // ---------------- UI 상태 ----------------
    function updateButtons(){
      btnLoadPdf.disabled = !(excelRows.length && pdfFile.files.length);
      btnCompare.disabled = !(pdfAllText.length && studentSelect.value !== "");
      btnCompareAll.disabled = !(pdfAllText.length && excelRows.length);
    }

    // ---------------- 이벤트 ----------------
    excelFile.addEventListener("change", async () => {
      const f = excelFile.files[0];
      if(!f) return;

      try{
        document.getElementById("excelMsg").textContent = "엑셀 분석 중...";
        const smart = await loadExcelSmart(f);

        excelRows = smart.rows;
        headers = smart.headers;
        headerRowIdx = smart.headerRowIdx;

        studentSelect.innerHTML = `<option value="">-- 수강생 선택 --</option>`;
        const nameCol = pickNameColumn();
        const taskCol = pickTaskColumn();

        excelRows.forEach((r, i) => {
          const name = (nameCol ? String(r[nameCol] ?? "").trim() : "") || `행${i+1}`;
          const task = taskCol ? String(r[taskCol] ?? "").trim().slice(0, 30) : "";
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = `${name} | ${task}`;
          studentSelect.appendChild(opt);
        });

        document.getElementById("excelMsg").innerHTML =
          `✅ ${f.name} / ${excelRows.length}명 로드 (헤더행: ${headerRowIdx+1})`;

        statusEl.innerHTML =
          `<span class="ok">엑셀 로드 완료</span> <span class="small">| 이름컬럼: ${pickNameColumn() || "(미탐지)"} / 과제컬럼: ${pickTaskColumn() || "(미탐지)"}</span>`;
      }catch(e){
        document.getElementById("excelMsg").innerHTML = `<span class="err">엑셀 로드 실패: ${e.message}</span>`;
        statusEl.innerHTML = `<span class="err">엑셀 파싱 실패</span>`;
        excelRows = []; headers = [];
      }

      updateButtons();
    });

    pdfFile.addEventListener("change", () => {
      const f = pdfFile.files[0];
      if(!f) return;
      document.getElementById("pdfMsg").textContent = `선택: ${f.name}`;
      updateButtons();
    });

    studentSelect.addEventListener("change", updateButtons);

    btnLoadPdf.addEventListener("click", async () => {
      const f = pdfFile.files[0];
      if(!f) return alert("PDF를 선택하세요.");
      statusEl.innerHTML = `<span class="warn">PDF 텍스트 추출 중...</span>`;
      pdfPages = [];
      pdfAllText = "";

      try{
        const buf = await f.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

        for(let p=1; p<=pdf.numPages; p++){
          const page = await pdf.getPage(p);
          const tc = await page.getTextContent();
          const text = tc.items.map(x => x.str).join(" ");
          pdfPages.push({ page: p, text });
          pdfAllText += "\n" + text;

          if(p % 5 === 0) statusEl.textContent = `PDF 추출 진행: ${p}/${pdf.numPages}`;
        }

        statusEl.innerHTML = `<span class="ok">PDF 추출 완료 (${pdf.numPages}페이지)</span>`;
      }catch(e){
        statusEl.innerHTML = `<span class="err">PDF 추출 실패: ${e.message}</span>`;
        pdfPages = []; pdfAllText = "";
      }

      updateButtons();
    });

    // ---------------- 학생별 섹션 추출 ----------------
    function findStudentSection(row){
      const name = pickName(row);
      const taskCol = pickTaskColumn();
      const task = taskCol ? String(row[taskCol] ?? "").trim() : "";

      // 1순위: 이름 포함 페이지
      let hits = [];
      if(name){
        hits = pdfPages.filter(p => p.text.includes(name));
      }

      // 2순위: 과제명 앞 12글자 포함 페이지
      if(!hits.length && task){
        const tk = task.replace(/\s+/g, " ").slice(0, 12);
        if(tk) hits = pdfPages.filter(p => p.text.includes(tk));
      }

      if(hits.length){
        const picked = hits.slice(0, 4);
        return {
          text: picked.map(h => h.text).join(" "),
          where: `페이지 ${picked.map(h => h.page).join(", ")}`,
          confidence: "high"
        };
      }

      // 3순위 fallback: 전체 PDF
      return {
        text: pdfAllText,
        where: "전체 PDF (이름/과제명 페이지 매칭 실패)",
        confidence: "low"
      };
    }

    // ---------------- 비교 ----------------
    function compareOne(row){
      const sec = findStudentSection(row);
      const base = sec.text;
      const details = [];

      for(const field of fields){
        const col = findCol(field);
        const ev = col ? String(row[col] ?? "").trim() : "";
        const pv = extractNear(base, fieldKeywords(field), 900);

        if(!ev){
          details.push({ field, status:"missing_excel", note:"엑셀값 없음", ev:"", pv:"", score:0 });
          continue;
        }
        if(!pv){
          details.push({ field, status:"missing_pdf", note:"PDF 항목 미발견", ev, pv:"", score:0 });
          continue;
        }

        // 타입별 판정
        if(field === "과제명" || field === "진행률"){
          const en = normalize(ev), pn = normalize(pv);
          if(en === pn){
            details.push({ field, status:"match", note:"정확 일치", ev, pv, score:1 });
          }else if(pn.includes(en) || en.includes(pn)){
            details.push({ field, status:"similar", note:"부분 일치", ev, pv, score:0.7 });
          }else{
            const sc = tokenRatio(ev, pv);
            details.push({
              field,
              status: sc >= 0.45 ? "similar" : "mismatch",
              note: `유사도 ${Math.round(sc*100)}%`,
              ev, pv, score: sc
            });
          }
          continue;
        }

        if(
          field.includes("문제 인식") ||
          field.includes("솔루션 설계") ||
          field.includes("LLM 활용") ||
          field.includes("검증 및 개선") ||
          field.includes("프로젝트")
        ){
          const eL = findLevel(ev), pL = findLevel(pv);
          if(eL && pL && eL === pL){
            details.push({ field, status:"match", note:`등급 일치: ${eL}`, ev, pv, score:1 });
          }else if(eL && pL){
            details.push({ field, status:"mismatch", note:`등급 불일치 (엑셀:${eL}/PDF:${pL})`, ev, pv, score:0 });
          }else{
            const sc = tokenRatio(ev, pv);
            details.push({
              field,
              status: sc >= 0.35 ? "similar" : "mismatch",
              note: `등급 판독 애매, 유사도 ${Math.round(sc*100)}%`,
              ev, pv, score: sc
            });
          }
          continue;
        }

        const sc = tokenRatio(ev, pv);
        const st = sc >= 0.55 ? "match" : sc >= 0.25 ? "similar" : "mismatch";
        details.push({ field, status:st, note:`유사도 ${Math.round(sc*100)}%`, ev, pv, score: sc });
      }

      const summary = {
        match: details.filter(x=>x.status==="match").length,
        similar: details.filter(x=>x.status==="similar").length,
        mismatch: details.filter(x=>x.status==="mismatch").length,
        missing_pdf: details.filter(x=>x.status==="missing_pdf").length,
        missing_excel: details.filter(x=>x.status==="missing_excel").length,
      };

      return {
        name: pickName(row) || "(이름없음)",
        where: sec.where,
        confidence: sec.confidence,
        details,
        summary
      };
    }

    function badge(st){
      if(st==="match") return `<span class="badge match">일치</span>`;
      if(st==="similar") return `<span class="badge similar">유사</span>`;
      if(st==="mismatch") return `<span class="badge mismatch">불일치</span>`;
      return `<span class="badge missing">누락</span>`;
    }

    function renderOne(res){
      const s = res.summary;
      let html = `
        <h3 style="margin:0 0 8px">결과: ${res.name}</h3>
        <div class="muted">검색 범위: ${res.where} / 섹션매칭 신뢰도: ${res.confidence}</div>
        <div class="chips">
          <span class="chip match">일치 ${s.match}</span>
          <span class="chip similar">유사 ${s.similar}</span>
          <span class="chip mismatch">불일치 ${s.mismatch}</span>
          <span class="chip missing">PDF미발견 ${s.missing_pdf}</span>
          <span class="chip missing">엑셀없음 ${s.missing_excel}</span>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width:18%">항목</th>
              <th style="width:12%">판정</th>
              <th style="width:27%">엑셀 값</th>
              <th style="width:27%">PDF 근거</th>
              <th style="width:16%">비고</th>
            </tr>
          </thead>
          <tbody>
      `;

      res.details.forEach(d => {
        const bar = `<div class="pbar"><div class="pfill" style="width:${Math.round((d.score||0)*100)}%"></div></div>`;
        html += `
          <tr>
            <td><b>${d.field}</b></td>
            <td>${badge(d.status)}${bar}</td>
            <td><div class="txt">${(d.ev || "(없음)").slice(0,1200)}</div></td>
            <td><div class="txt">${(d.pv || "(없음)").slice(0,1200)}</div></td>
            <td class="small">${d.note || ""}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      resultEl.innerHTML = html;
    }

    // ---------------- 버튼 액션 ----------------
    btnCompare.addEventListener("click", () => {
      const idx = parseInt(studentSelect.value, 10);
      if(isNaN(idx)) return alert("수강생을 선택하세요.");
      const row = excelRows[idx];
      const res = compareOne(row);
      renderOne(res);
    });

    btnCompareAll.addEventListener("click", () => {
      if(!excelRows.length) return;
      statusEl.innerHTML = `<span class="warn">전체 비교 중...</span>`;

      const all = excelRows.map(r => compareOne(r));
      const ranked = all.map(x => {
        const score = (x.summary.match*2) + (x.summary.similar) - (x.summary.mismatch*2) - (x.summary.missing_pdf);
        return { ...x, rankScore: score };
      }).sort((a,b) => a.rankScore - b.rankScore); // 문제 큰 순

      let html = `<h3 style="margin:0 0 8px">전체 수강생 일괄 비교 (문제 큰 순)</h3>`;
      html += `
        <table>
          <thead>
            <tr>
              <th>수강생</th>
              <th>일치</th>
              <th>유사</th>
              <th>불일치</th>
              <th>PDF미발견</th>
              <th>엑셀없음</th>
              <th>점수</th>
              <th>섹션매칭</th>
            </tr>
          </thead><tbody>
      `;

      ranked.forEach(x => {
        html += `
          <tr>
            <td>${x.name}</td>
            <td>${x.summary.match}</td>
            <td>${x.summary.similar}</td>
            <td style="color:#991b1b;font-weight:700">${x.summary.mismatch}</td>
            <td>${x.summary.missing_pdf}</td>
            <td>${x.summary.missing_excel}</td>
            <td>${x.rankScore}</td>
            <td>${x.confidence}</td>
          </tr>
        `;
      });

      html += `</tbody></table>
        <div class="muted" style="margin-top:8px">
          ※ 상세 결과는 수강생을 선택한 뒤 "선택 수강생 비교"를 눌러 확인하세요.
        </div>
      `;
      resultEl.innerHTML = html;
      statusEl.innerHTML = `<span class="ok">전체 비교 완료 (${all.length}명)</span>`;
    });
  </script>
</body>
</html>
